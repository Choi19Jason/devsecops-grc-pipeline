<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">devsecops-grc-pipeline architecture</title>
<desc id="d">Your PC pushes to the GitHub repo. GitHub Actions runs Trivy, CodeQL and OWASP ZAP, and Dependabot watches the dependency list. Findings land in the Security tab, a ZAP report artifact and Dependabot alerts, then feed triage and fixes, which loop back to your PC and feed the GRC layer.</desc>
<rect x="0.75" y="0.75" width="1158.5" height="558.5" rx="22" ry="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5"/>
<text x="36" y="44" font-size="20" font-weight="600" fill="#2C2C2A">devsecops-grc-pipeline: architecture</text>
<text x="36" y="66" font-size="13" fill="#5F5E5A">Every push to main runs three scan jobs in GitHub Actions. Findings are triaged, fixed, and pushed again.</text>
